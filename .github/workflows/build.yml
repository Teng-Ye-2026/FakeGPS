name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev libtinfo-dev cmake \
            libffi-dev libssl-dev

      - name: Install buildozer (in a dedicated 3.11 venv)
        run: |
          python -m venv /opt/buildozer-venv
          . /opt/buildozer-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.33"

      - name: Verify Python environment
        run: |
          . /opt/buildozer-venv/bin/activate
          echo "=== Python version used to build (must be 3.11.x) ==="
          python --version
          which buildozer
          python -m pip show buildozer | head -3
          if ! python --version 2>&1 | grep -q "3.11"; then
            echo "ERROR: expected Python 3.11 but got the version above. Aborting."
            exit 1
          fi

      - name: Build APK (debug)
        run: |
          . /opt/buildozer-venv/bin/activate
          python -m buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fakegps-apk
          path: bin/*.apk
