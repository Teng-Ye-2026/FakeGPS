name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    # 用 Ubuntu 22.04 而非 ubuntu-latest：
    # 最新的 24.04 自带 autoconf 2.72 + libtool 2.4.7，与 python-for-android 内旧版
    # libffi 的 configure.ac 不兼容，会导致 autoreconf 报 LT_SYS_SYMBOL_USCORE 而失败。
    # 22.04 的 autoconf 2.71 + libtool 2.4.6 是 p4a 官方验证过的兼容组合。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev libtinfo-dev cmake \
            libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer "cython==0.29.33"

      - name: Build APK (debug)
        run: buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fakegps-apk
          path: bin/*.apk
